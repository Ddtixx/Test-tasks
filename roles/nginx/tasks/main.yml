---
- name: Установка nginx
  apt:
    name: nginx
    state: present

- name: Создание корневой директории сайта
  file:
    path: "{{ nginx_web_root }}"
    state: directory
    owner: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
    mode: '0755'

- name: Развернуть index.html
  copy:
    content: "{{ nginx_index_content }}"
    dest: "{{ nginx_web_root }}/index.html"
    owner: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
    mode: '0644'
  notify: Reload nginx

- name: Запуск nginx
  systemd:
    name: "{{ nginx_service_name }}"
    state: started
    enabled: true

